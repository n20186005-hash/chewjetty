#:schema node_modules/wrangler/config-schema.json
name = "chew-jetty"
compatibility_date = "2025-08-11"

# Worker entry-point generated by @astrojs/cloudflare (works for both
# `output: 'static'` and `output: 'server'`).
main = "./dist/_worker.js/index.js"

# Serve the static build output as Worker Static Assets.
# Deploy command: npx wrangler deploy
[assets]
directory = "./dist"
